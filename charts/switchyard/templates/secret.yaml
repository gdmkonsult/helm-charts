apiVersion: v1
kind: Secret
metadata:
  name: {{ include "switchyard.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  ROUTER_API_KEY: {{ include "switchyard.apiKey" (dict "value" .Values.auth.apiKey "context" .) | quote }}
  {{- range $i, $m := .Values.models }}
  MODEL_{{ $i }}_API_KEY: {{ $m.apiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.capable }}
  CAPABLE_API_KEY: {{ .Values.capable.apiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.efficient }}
  EFFICIENT_API_KEY: {{ .Values.efficient.apiKey | default "" | quote }}
  {{- end }}
  routes.toml: |
    {{- if .Values.customRoutesToml }}
    {{- .Values.customRoutesToml | nindent 4 }}
    {{- else }}
    schema_version = 1

    {{- if .Values.models }}
    # ==============================================================================
    # MULTI-MODEL CONFIGURATION ({{ len .Values.models }} configured models)
    # ==============================================================================

    {{- range $i, $m := .Values.models }}
    # --- Model {{ $i }}: {{ $m.id }} ({{ $m.provider }}) ---
    [llm_clients.client_{{ $i }}]
    {{- if eq $m.provider "azure_openai" }}
    format = "openai_chat"
    {{- if contains "?" $m.baseUrl }}
    base_url = "{{ $m.baseUrl | trimSuffix "/" }}/openai/deployments/{{ $m.id }}"
    {{- else }}
    base_url = "{{ $m.baseUrl | trimSuffix "/" }}/openai/deployments/{{ $m.id }}?api-version=2024-10-21"
    {{- end }}
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    extra_headers = { "api-key" = "{{ $m.apiKey }}" }
    {{- else if eq $m.provider "azure_foundry" }}
    format = "openai_chat"
    base_url = "{{ $m.baseUrl | trimSuffix "/" }}"
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    {{- else if eq $m.provider "anthropic" }}
    format = "anthropic_messages"
    base_url = "{{ default "https://api.anthropic.com" $m.baseUrl | trimSuffix "/" }}"
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    {{- else if eq $m.provider "gdm_ai" }}
    format = "openai_chat"
    base_url = "{{ default "https://ai.gdm.se/api/v1" $m.baseUrl | trimSuffix "/" }}"
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    {{- else if eq $m.provider "openai" }}
    format = "openai_chat"
    base_url = "{{ default "https://api.openai.com/v1" $m.baseUrl | trimSuffix "/" }}"
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    {{- else }}
    format = "{{ default "openai_chat" $m.format }}"
    base_url = "{{ $m.baseUrl | trimSuffix "/" }}"
    api_key_env = "MODEL_{{ $i }}_API_KEY"
    {{- end }}

    [targets.target_{{ $i }}]
    id = "{{ $m.id }}"
    llm_client = "client_{{ $i }}"

    # Direct passthrough route for model '{{ $m.id }}'
    [routes.direct_{{ $i }}]
    id = "{{ $m.id }}"
    type = "passthrough"
    target = "target_{{ $i }}"
    {{ end }}

    {{- $modelCount := len .Values.models }}
    {{- if eq $modelCount 1 }}
    # --- Single Model: Automatic Passthrough Route ---
    [routes.main]
    id = "{{ default "switchyard" .Values.router.routeId }}"
    type = "passthrough"
    target = "target_0"

    {{- else if eq $modelCount 2 }}
    # --- 2 Models: Stage Router (Fast vs Capable) ---
    [routes.main]
    id = "{{ default "switchyard" .Values.router.routeId }}"
    type = "{{ default "stage_router" .Values.router.algorithm }}"
    {{- if eq (default "stage_router" .Values.router.algorithm) "stage_router" }}
    efficient_target = "target_0"
    capable_target = "target_1"
    picker = "{{ default "efficient_first" .Values.router.picker }}"
    confidence_threshold = {{ default 0.5 .Values.router.confidenceThreshold }}
    {{- else }}
    target = "target_0"
    {{- end }}

    {{- else }}
    # --- 3+ Models: Multi-Tier Stage Router ---
    [routes.main]
    id = "{{ default "switchyard" .Values.router.routeId }}"
    type = "stage_router"
    efficient_target = "target_0"
    capable_target = "target_{{ sub $modelCount 1 }}"
    picker = "{{ default "efficient_first" .Values.router.picker }}"
    confidence_threshold = {{ default 0.5 .Values.router.confidenceThreshold }}

    {{- if eq $modelCount 3 }}
    # Intermediate pairings for 3-tier architectures (e.g. Luna / Sol / Terra)
    [routes.fast_tier]
    id = "switchyard-fast"
    type = "stage_router"
    efficient_target = "target_0"
    capable_target = "target_1"
    picker = "efficient_first"
    confidence_threshold = 0.5

    [routes.heavy_tier]
    id = "switchyard-heavy"
    type = "stage_router"
    efficient_target = "target_1"
    capable_target = "target_2"
    picker = "efficient_first"
    confidence_threshold = 0.5
    {{- end }}
    {{- end }}

    {{- else }}
    # ==============================================================================
    # LEGACY 2-TIER CONFIGURATION (Capable vs Efficient)
    # ==============================================================================

    # --- Capable Tier Client ---
    [llm_clients.capable_client]
    {{- if eq .Values.capable.provider "azure_openai" }}
    format = "openai_chat"
    {{- if contains "?" .Values.capable.baseUrl }}
    base_url = "{{ .Values.capable.baseUrl | trimSuffix "/" }}/openai/deployments/{{ .Values.capable.modelId }}"
    {{- else }}
    base_url = "{{ .Values.capable.baseUrl | trimSuffix "/" }}/openai/deployments/{{ .Values.capable.modelId }}?api-version=2024-10-21"
    {{- end }}
    api_key_env = "CAPABLE_API_KEY"
    extra_headers = { "api-key" = "{{ .Values.capable.apiKey }}" }
    {{- else if eq .Values.capable.provider "azure_foundry" }}
    format = "openai_chat"
    base_url = "{{ .Values.capable.baseUrl | trimSuffix "/" }}"
    api_key_env = "CAPABLE_API_KEY"
    {{- else if eq .Values.capable.provider "anthropic" }}
    format = "anthropic_messages"
    base_url = "{{ default "https://api.anthropic.com" .Values.capable.baseUrl | trimSuffix "/" }}"
    api_key_env = "CAPABLE_API_KEY"
    {{- else if eq .Values.capable.provider "gdm_ai" }}
    format = "openai_chat"
    base_url = "{{ default "https://ai.gdm.se/api/v1" .Values.capable.baseUrl | trimSuffix "/" }}"
    api_key_env = "CAPABLE_API_KEY"
    {{- else if eq .Values.capable.provider "openai" }}
    format = "openai_chat"
    base_url = "{{ default "https://api.openai.com/v1" .Values.capable.baseUrl | trimSuffix "/" }}"
    api_key_env = "CAPABLE_API_KEY"
    {{- else }}
    format = "{{ default "openai_chat" .Values.capable.format }}"
    base_url = "{{ .Values.capable.baseUrl | trimSuffix "/" }}"
    api_key_env = "CAPABLE_API_KEY"
    {{- end }}

    # --- Efficient Tier Client ---
    [llm_clients.efficient_client]
    {{- if eq .Values.efficient.provider "azure_openai" }}
    format = "openai_chat"
    {{- if contains "?" .Values.efficient.baseUrl }}
    base_url = "{{ .Values.efficient.baseUrl | trimSuffix "/" }}/openai/deployments/{{ .Values.efficient.modelId }}"
    {{- else }}
    base_url = "{{ .Values.efficient.baseUrl | trimSuffix "/" }}/openai/deployments/{{ .Values.efficient.modelId }}?api-version=2024-10-21"
    {{- end }}
    api_key_env = "EFFICIENT_API_KEY"
    extra_headers = { "api-key" = "{{ .Values.efficient.apiKey }}" }
    {{- else if eq .Values.efficient.provider "azure_foundry" }}
    format = "openai_chat"
    base_url = "{{ .Values.efficient.baseUrl | trimSuffix "/" }}"
    api_key_env = "EFFICIENT_API_KEY"
    {{- else if eq .Values.efficient.provider "anthropic" }}
    format = "anthropic_messages"
    base_url = "{{ default "https://api.anthropic.com" .Values.efficient.baseUrl | trimSuffix "/" }}"
    api_key_env = "EFFICIENT_API_KEY"
    {{- else if eq .Values.efficient.provider "gdm_ai" }}
    format = "openai_chat"
    base_url = "{{ default "https://ai.gdm.se/api/v1" .Values.efficient.baseUrl | trimSuffix "/" }}"
    api_key_env = "EFFICIENT_API_KEY"
    {{- else if eq .Values.efficient.provider "openai" }}
    format = "openai_chat"
    base_url = "{{ default "https://api.openai.com/v1" .Values.efficient.baseUrl | trimSuffix "/" }}"
    api_key_env = "EFFICIENT_API_KEY"
    {{- else }}
    format = "{{ default "openai_chat" .Values.efficient.format }}"
    base_url = "{{ .Values.efficient.baseUrl | trimSuffix "/" }}"
    api_key_env = "EFFICIENT_API_KEY"
    {{- end }}

    # --- Targets ---
    [targets.capable]
    id = "{{ .Values.capable.modelId }}"
    llm_client = "capable_client"

    [targets.efficient]
    id = "{{ .Values.efficient.modelId }}"
    llm_client = "efficient_client"

    # Direct passthrough routes
    [routes.direct_capable]
    id = "{{ .Values.capable.modelId }}"
    type = "passthrough"
    target = "capable"

    [routes.direct_efficient]
    id = "{{ .Values.efficient.modelId }}"
    type = "passthrough"
    target = "efficient"

    # --- Routes ---
    [routes.main]
    id = "{{ default "switchyard" .Values.router.routeId }}"
    type = "{{ default "stage_router" .Values.router.algorithm }}"
    {{- if eq (default "stage_router" .Values.router.algorithm) "stage_router" }}
    capable_target = "capable"
    efficient_target = "efficient"
    picker = "{{ default "efficient_first" .Values.router.picker }}"
    confidence_threshold = {{ default 0.5 .Values.router.confidenceThreshold }}
    {{- else if eq .Values.router.algorithm "auto" }}
    capable_target = "capable"
    efficient_target = "efficient"
    {{- else if eq .Values.router.algorithm "passthrough" }}
    target = "capable"
    {{- end }}
    {{- end }}
    {{- end }}
