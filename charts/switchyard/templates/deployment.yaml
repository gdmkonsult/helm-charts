apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switchyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "switchyard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchyard.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ if .Values.auth.enabled }}"8080"{{ else }}"4000"{{ end }}
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: switchyard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/switchyard/routes.toml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "4000"
          ports:
            - name: router
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "switchyard.fullname" . }}-secret
          volumeMounts:
            - name: config
              mountPath: /etc/switchyard
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.auth.enabled }}
        - name: auth-proxy
          image: "{{ .Values.auth.proxyImage.repository }}:{{ .Values.auth.proxyImage.tag }}"
          imagePullPolicy: {{ .Values.auth.proxyImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchyard.fullname" . }}-secret
                  key: ROUTER_API_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 8080;
                server_name _;
                client_max_body_size 64M;

                location = /health {
                  proxy_pass http://127.0.0.1:4000/health;
                }

                location = /metrics {
                  proxy_pass http://127.0.0.1:4000/metrics;
                }
              EOF

              cat >> /etc/nginx/conf.d/default.conf <<EOF
                location / {
                  default_type application/json;
                  set \$auth_ok 0;
                  if (\$http_authorization = "Bearer ${ROUTER_API_KEY}") {
                    set \$auth_ok 1;
                  }
                  if (\$http_x_api_key = "${ROUTER_API_KEY}") {
                    set \$auth_ok 1;
                  }
                  if (\$auth_ok = 0) {
                    return 401 '{"error":{"message":"Incorrect or missing API key","type":"authentication_error","code":"invalid_api_key"}}';
                  }

                  proxy_pass http://127.0.0.1:4000;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_buffering off;
                  proxy_read_timeout 900s;
                  proxy_send_timeout 900s;
                }
              }
              EOF

              exec nginx -g 'daemon off;'
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: config
          secret:
            secretName: {{ include "switchyard.fullname" . }}-secret
            items:
              - key: routes.toml
                path: routes.toml
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
