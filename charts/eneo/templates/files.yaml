apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eneo.fullname" . }}-files
  annotations:
    # The migrate pre-install hook mounts this ConfigMap, so it must exist
    # before the hook runs. Hooks run before regular manifests on fresh
    # installs; weight -10 orders it ahead of the migrate job (weight -5).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "eneo.labels" . | nindent 4 }}
data:
  generate_models.py: |
{{ .Files.Get "files/generate_models.py" | indent 4 }}
  gdm.py: |
{{ .Files.Get "files/gdm.py" | indent 4 }}
  wait_for_db.py: |
{{ .Files.Get "files/wait_for_db.py" | indent 4 }}
  oidc.json: |
{{ .Values.oidc | toJson | indent 4 }}
  gdm.json: |
{{ .Values.gdmModels | toJson | indent 4 }}