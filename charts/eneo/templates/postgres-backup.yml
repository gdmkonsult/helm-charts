{{- if or .Values.postgres.snapshotBackup.enabled (not (or .Values.global.testCluster .Values.testEnvironment)) }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "eneo.fullname" . }}-postgres-backup
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.postgres.snapshotBackup.enabled }}
  schedule: {{ .Values.postgres.snapshotBackup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ include "eneo.fullname" . }}-postgres
  method: volumeSnapshot
  {{- else }}
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ include "eneo.fullname" . }}-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- end }}
{{- end }}