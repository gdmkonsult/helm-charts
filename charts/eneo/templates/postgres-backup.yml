{{- if not (or .Values.global.testCluster .Values.testEnvironment) }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "eneo.fullname" . }}-postgres-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep alongside the Cluster hook (weight -20): this ScheduledBackup
    # references the Cluster, which is itself a pre-install hook.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
spec:
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ include "eneo.fullname" . }}-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}