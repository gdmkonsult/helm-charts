{{- if not (or .Values.global.testCluster .Values.testEnvironment) }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "eneo.fullname" . }}-backup-store
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep alongside the Cluster hook (weight -20): the Cluster's WAL
    # archiver plugin references this ObjectStore, so it must exist when the
    # Cluster is reconciled.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
spec:
  retentionPolicy: 3d
  configuration:
    destinationPath: s3://gdm-rke2-ai-services-eneo/{{ .Release.Namespace }}/postgres
    endpointURL: https://rustfs.k8s.gdmcloud.se
    s3Credentials:
      accessKeyId:
        name: {{ include "eneo.fullname" . }}-backup-secret
        key: ACCESS_KEY
      secretAccessKey:
        name: {{ include "eneo.fullname" . }}-backup-secret
        key: SECRET_KEY
    wal:
      compression: gzip
{{- end }}