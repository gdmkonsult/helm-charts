{{- if and .Values.crawlerWorker.enabled (include "eneo.hasCrawlerQueue" .) -}}
# Eneo 2.3+ routes website crawls to arq:crawler; only WORKER_ROLE=crawler consumes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eneo.fullname" . }}-crawler-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eneo.labels" . | nindent 4 }}
    app.kubernetes.io/component: crawler-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.crawlerWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "eneo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: crawler-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "eneo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crawler-worker
    spec:
      # Upstream stop_grace_period: lets a crawl checkpoint before SIGKILL.
      terminationGracePeriodSeconds: 70
      containers:
      - name: crawler-worker
        image: {{ include "eneo.image" (dict "context" . "image" .Values.crawlerWorker.image) | quote }}
        imagePullPolicy: {{ .Values.crawlerWorker.image.pullPolicy }}
        env:
        - name: TZ
          value: {{ .Values.global.timeZone | quote }}
        - name: RUN_AS_WORKER
          value: "true"
        - name: WORKER_ROLE
          value: crawler
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "eneo.fullname" . }}-postgres-app
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "eneo.fullname" . }}-postgres-app
              key: password
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "eneo.fullname" . }}-postgres-app
              key: host
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "eneo.fullname" . }}-postgres-app
              key: port
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "eneo.fullname" . }}-postgres-app
              key: dbname
        envFrom:
        - configMapRef:
            name: {{ include "eneo.fullname" . }}-config
        - secretRef:
            name: {{ include "eneo.fullname" . }}-secrets
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        {{- with .Values.crawlerWorker.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "eneo.fullname" . }}-shared-data
      # Must NOT be the shared-tmp PVC: on startup the crawler deletes every
      # orphaned crawl directory in /tmp, including those of other workers.
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.crawlerWorker.tmpSizeLimit }}
{{- end }}
