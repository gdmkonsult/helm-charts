{{- if .Values.networkPolicy.enabled }}
{{- if .Values.redis.enabled }}
# Redis holds pickled ARQ jobs: only this release may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eneo.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eneo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      {{- include "eneo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "eneo.selectorLabels" . | nindent 10 }}
    ports:
    - port: {{ .Values.redis.service.targetPort }}
      protocol: TCP
{{- end }}
{{- if and .Values.postgres.enabled .Values.postgres.operatorManaged }}
---
# Postgres: this namespace (the customer's releases, incl. copyFrom clones),
# the CNPG operator, and metrics scraping from anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eneo.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eneo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "eneo.fullname" . }}-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpgOperatorNamespace }}
  - from:
    - namespaceSelector: {}
    ports:
    - port: 9187
      protocol: TCP
{{- end }}
{{- end }}
