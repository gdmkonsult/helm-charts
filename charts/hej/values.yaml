# Global settings
global:
  domain: ""
  testEnvironment: false

customer:
  company: ""
  companyShort: ""
  companyAccent: "#7950ff"

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: pull-secret

# MariaDB persistent storage & configuration
mariadb:
  enabled: true
  # Uses mariadb-operator (k8s.mariadb.com/v1alpha1)
  image:
    repository: docker-registry1.mariadb.com/library/mariadb
    tag: "11.4.5"
    pullPolicy: IfNotPresent
  auth:
    database: ai
    username: ai
    password: "" # Auto-generated if empty
    rootPassword: "" # Auto-generated if empty
  init:
    # Seed the default app_modes (AZURE_FOUNDRY__0, FOUNDRY_IMAGE_GENERATION and,
    # with ai.gdmModels.enabled, GDM_AI_CHAT_COMPLETION__0) in the init SqlJob.
    # Set to false for tenants migrated with an existing database so no modes
    # are added on install or on any later upgrade.
    seedModes: true
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "100m"
      memory: 256Mi
  backup:
    enabled: true
    schedule: "0 2 * * *" # Every night at 02:00
    retention: "168h"      # 7 days retention
    s3:
      bucket: "gdm-rke2-ai-services-hej"
      endpoint: "rustfs.k8s.gdmcloud.se"
      region: "us-east-1"

# Simoon UI (Frontend & Node/Express Proxy)
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/gdmkonsult/simoon-ui
    tag: "" # Defaults to .Chart.AppVersion
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "50m"
      memory: 128Mi

overview:
  serviceAccountName: hej-overview
  serviceAccountNamespace: gdmai

# GDM OpenAI Backend (Quart / Hypercorn Python service)
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/gdmkonsult/gdm-openai
    tag: "" # Defaults to .Chart.AppVersion
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi # For /app/FILES (uploads & temporary project files)
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "100m"
      memory: 256Mi

# Ingress Configuration (Traefik + cert-manager)
ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "10"
  tls:
    enabled: true
  # Additional domains (e.g. legacy <tenant>.ai.gdmcloud.se during migration)
  extraHosts: []

# Authentication Settings
auth:
  # "v2" uses Keycloak / standard OIDC; "legacy" uses Microsoft Entra ID direct
  mode: "v2"
  authority: "" # e.g. https://idp.gdmcloud.se/realms/gdmai or Entra ID tenant
  clientId: ""  # OIDC Client ID
  clientSecret: "" # OIDC / Entra ID Client Secret
  groupId: ""   # Optional group ID filter for legacy auth
  jwksUri: ""   # Optional custom JWKS URI

# Secrets (auto-generated if empty)
secrets:
  cryptrSecret: ""
  expressSessionSecret: ""
  consolePassword: ""
  superPassword: ""
  hejOverviewPassword: ""
  adminAllowedIps: "" # Comma-separated IP allowlist for /console & /super

# Upstream AI Provider Settings
ai:
  gdmAiApiKey: "update-later"
  gdmAiEndpoint: "https://ai.gdm.se/api/v1"
  gdmAiImageEditUrl: ""
  # Legacy Azure OpenAI provider (required by the keycloak backend image)
  azureOpenAiKey: ""
  azureOpenAiEndpoint: ""
  azureOpenAiModel: ""
  azureOpenAiLabelModel: ""
  azureOpenAiImageModel: ""
  azureOpenAiTranscriptionModel: ""
  # GDM Models (opt-in; auto-provisioned API key via LLM Portal)
  gdmModels:
    enabled: false
    apiKey: ""
  foundryEndpoint: "not-in-use"
  foundryKey: "not-in-use"
  foundryProjectName: "not-in-use"
  foundryLabelModel: "not-in-use"
  foundryRefinementModel: "not-in-use"
  foundryTtsModel: "not-in-use"
  foundryTranscriptionModel: "not-in-use"
  # GDM Assistant API
  gdmAssistantEndpoint: ""
  gdmAssistantApiKey: ""
  gdmAssistantLabelModel: ""
  # GDM N8N Integration
  gdmN8nUser: ""
  gdmN8nPass: ""
  instructionChatGeneral: "Du är en hjälpsam assistent."
  instructionChatLabel: "Ditt jobb är att returnera en lämplig chattetikett för följande konversation. Etiketten bör inte vara längre än 4 ord. Vänligen läs följande användarprompt och tilldela en lämplig etikett för chatten. Svara på det språk som används."

# Host aliases for DNS overrides (e.g. internal n8n)
hostAliases: []

# Extensibility: Additional environment variables & secrets for future needs
extraEnv: []
extraSecrets: {}

# Custom branding assets (Base64 encoded)
# If left empty, Simoon UI defaults will be served
branding:
  logoBase64: ""
  backgroundBase64: ""

# SMTP Settings for feedback form
smtp:
  host: "smtprelay.gdmnet.se"
  port: 25
  secure: false
  from: "feedback@gdm.se"
