# Global settings
global:
  domain: ""
  # Kept for compatibility with values created before testEnvironment moved
  # to the root of the chart.
  testEnvironment: false

# Disables scheduled database backups and marks the installation as a test app.
testEnvironment: false

# Clone from an existing deployment in the same namespace. A fresh logical
# backup is created from the source MariaDB and restored before the backend
# starts. This only takes effect on initial deploy.
copyFrom:
  enabled: false
  releaseName: ""

customer:
  company: ""
  companyShort: ""
  companyAccent: "#7950ff"

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: pull-secret

# MariaDB persistent storage & configuration
mariadb:
  enabled: true
  # Uses mariadb-operator (k8s.mariadb.com/v1alpha1)
  image:
    repository: docker-registry1.mariadb.com/library/mariadb
    tag: "11.4.5"
    pullPolicy: IfNotPresent
  auth:
    database: ai
    username: ai
    password: "" # Auto-generated if empty
    rootPassword: "" # Auto-generated if empty
  init:
    # Seed the default app_modes (AZURE_FOUNDRY__0, FOUNDRY_IMAGE_GENERATION and,
    # with ai.gdmModels.enabled, GDM_AI_CHAT_COMPLETION__0) in the init SqlJob,
    # only while app_modes is empty, so deleted modes are not re-added on upgrade.
    # Set to false for tenants migrated with an existing database so no modes
    # are added on install or on any later upgrade.
    seedModes: true
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "100m"
      memory: 256Mi
  backup:
    enabled: true
    schedule: "0 2 * * *" # Every night at 02:00
    retention: "168h"      # 7 days retention
    s3:
      bucket: "gdm-rke2-ai-services-hej"
      endpoint: "rustfs.k8s.gdmcloud.se"
      region: "us-east-1"

# Simoon UI (Frontend & Node/Express Proxy)
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/gdmkonsult/simoon-ui
    tag: "" # Defaults to .Chart.AppVersion
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "50m"
      memory: 128Mi

overview:
  serviceAccountName: hej-overview
  serviceAccountNamespace: gdmai

# GDM OpenAI Backend (Quart / Hypercorn Python service)
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/gdmkonsult/gdm-openai
    tag: "" # Defaults to .Chart.AppVersion
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi # Mounted at /app/FILES but unused: attachments live in the DB (GDM chunks) or Foundry
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "100m"
      memory: 256Mi

# GDM Runtime Tools (hej-tool-runtime): sandboxed calculation, table analysis,
# charts and Word/PDF/Excel documents for modes with the "GDM Runtime Tools"
# switch on. Only the backend can call it, and it can only reach the backend
# (signed file downloads) and DNS.
toolRuntime:
  enabled: true
  image:
    repository: ghcr.io/gdmkonsult/hej-tool-runtime
    tag: "" # Defaults to .Chart.AppVersion
    pullPolicy: Always
  service:
    port: 8080
  # Refuse to become ready unless every job runs Landlock-confined (landrun).
  # Needs a Linux kernel >= 6.12 with Landlock enabled (Landlock ABI >= 6).
  requireConfinement: true
  # Left empty on purpose: a seccomp profile that filters the landlock_*
  # syscalls disables job confinement (readiness then fails closed). Set to
  # {type: RuntimeDefault} only after verifying /readyz on the target nodes.
  seccompProfile: {}
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "50m"
      memory: 192Mi
  # /tmp is memory-backed (job dirs) and counts towards the memory limit.
  tmpSizeLimit: 512Mi
  # Extra runtime env, e.g. MAX_CONCURRENCY, MAX_QUEUE, MAX_PER_USER, JOB_TIMEOUT_MS.
  env: {}
  nodeSelector: {}
  # Example: schedule only on nodes labelled as having a Landlock-capable
  # kernel (>= 6.12), e.g. `kubectl label node <n> hej.gdm.se/landlock=true`.
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: hej.gdm.se/landlock
  #               operator: In
  #               values: ["true"]
  affinity: {}
  tolerations: []
  networkPolicy:
    enabled: true

# Ingress Configuration (Traefik + cert-manager)
ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "10"
  tls:
    enabled: true
  # Additional domains (e.g. legacy <tenant>.ai.gdmcloud.se during migration)
  extraHosts: []

# Authentication Settings
auth:
  # "v2" uses Keycloak / standard OIDC; "legacy" uses Microsoft Entra ID direct
  mode: "v2"
  authority: "" # e.g. https://idp.gdmcloud.se/realms/gdmai or Entra ID tenant
  clientId: ""  # OIDC Client ID
  groupId: ""   # Optional group ID filter for legacy auth
  jwksUri: ""   # Optional custom JWKS URI

# Secrets (auto-generated if empty)
secrets:
  cryptrSecret: ""
  expressSessionSecret: ""
  consolePassword: ""
  superPassword: ""
  hejOverviewPassword: ""
  adminAllowedIps: "" # Comma-separated IP allowlist for /console & /super

# Upstream AI Provider Settings
ai:
  gdmAiApiKey: "update-later"
  gdmAiEndpoint: "https://ai.gdm.se/api/v1"
  gdmAiImageEditUrl: ""
  # GDM Models (opt-in; auto-provisioned API key via LLM Portal)
  gdmModels:
    enabled: false
    apiKey: ""
  foundryEndpoint: "not-in-use"
  foundryKey: "not-in-use"
  foundryProjectName: "not-in-use"
  foundryLabelModel: "not-in-use"
  foundryRefinementModel: "not-in-use"
  foundryTtsModel: "not-in-use"
  foundryTranscriptionModel: "not-in-use"
  # GDM N8N Integration
  gdmN8nUser: ""
  gdmN8nPass: ""
  instructionChatGeneral: "Du är en hjälpsam assistent."
  instructionChatLabel: "Ditt jobb är att returnera en lämplig chattetikett för följande konversation. Etiketten bör inte vara längre än 4 ord. Vänligen läs följande användarprompt och tilldela en lämplig etikett för chatten. Svara på det språk som används."

# Host aliases for DNS overrides (e.g. internal n8n)
hostAliases: []

# Extensibility: Additional environment variables & secrets for future needs
extraEnv: []
extraSecrets: {}

# Custom branding assets (Base64 encoded)
# If left empty, Simoon UI defaults will be served
branding:
  logoBase64: ""
  backgroundBase64: ""

# SMTP Settings for feedback form
smtp:
  host: "smtprelay.gdmnet.se"
  port: 25
  secure: false
  from: "feedback@gdm.se"
