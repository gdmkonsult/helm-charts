{{- if .Values.mariadb.enabled -}}
{{- if .Values.mariadb.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hej.fullname" . }}-mariadb-init-sql-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb-init
data:
  init.sql: |
    -- Bootstrap basic app_config
    INSERT IGNORE INTO app_config (config_key, config_value, description) VALUES
      ('msal.mode', '\"{{ if and .Values.auth.mode (ne .Values.auth.mode "legacy") }}v2{{ else }}legacy{{ end }}\"', 'MSAL mode'),
      ('msal.authority', '\"{{ regexFind "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}" .Values.auth.authority | default .Values.auth.authority }}\"', 'MSAL authority'),
      ('msal.clientId', '\"{{ .Values.auth.clientId }}\"', 'MSAL clientId'),
      ('customer.company', '\"{{ default .Release.Namespace .Values.customer.company }}\"', 'Company name'),
      ('customer.companyShort', '\"{{ default "GDM" .Values.customer.companyShort }}\"', 'Company short name'),
      ('customer.companyAccent', '\"{{ default "#7950ff" .Values.customer.companyAccent }}\"', 'Company accent color'),
      ('settings.applicationTitlePrefix', '\"Hej\"', 'Application title prefix'),
      ('settings.recurringInitialPolicy', 'false', 'Prompt for policy on recurring basis'),
      ('settings.dailyUserUsageLimitUsd', '100', 'Daily user usage limit USD'),
      ('defaultUserSettings.preferredLanguage', '\"sv\"', 'Default user language'),
      ('feedback.enabled', 'true', 'Enable feedback form'),
      ('feedback.emailRecipient', '\"feedback@gdm.se\"', 'Feedback recipient'),
      ('gptsSettings.enabled', 'true', 'Enable GPTs/Assistants feature'),
      ('gptsSettings.temporaryAccessUsage', 'false', 'Enable GPTs for temporary users'),
      ('gptsSettings.requiredGroupId', '\"\"', 'Group required for GPT creation'),
      ('gptsSettings.maxNameLength', '80', 'Max GPT name length'),
      ('gptsSettings.maxInstructionsLength', '75000', 'Max GPT instructions length');

    -- Bootstrap default languages
    INSERT IGNORE INTO app_languages (code, name, is_default, is_fallback, sort_order) VALUES
      ('sv', 'Svenska', 1, 0, 1),
      ('en', 'English', 0, 1, 2),
      ('no', 'Norsk', 0, 0, 3),
      ('fi', 'Suomi', 0, 0, 4);

    -- Bootstrap default policy modals
    INSERT IGNORE INTO app_modals (name, title, paragraphs, sort_order) VALUES
      ('InitialPolicy', 'AI Guidelines', '[\"When we use AI, we always have our customers, values, and goals in mind.\", \"AI can be wrong, so always verify facts and remove biased or inappropriate content. If you suspect plagiarism, check it. It is important that you take responsibility for and stand by the content you use.\", \"We clearly inform when material we use is wholly or mainly generated by AI.\"]', 1),
      ('TemporaryAccessPolicy', 'Welcome!', '[\"Explore and discover the power of our GenAI platform. Take the opportunity to experiment and explore all the possibilities that GenAI offers.\", \"Do not hesitate to contact us if you want tips or need help along the way. Good luck and have fun!\", \"Terms of use: Data is processed in GDMs Swedish data centers and is not used for training. No data is stored unless you have activated the History function. Upon activation, you will get more information about what applies.\"]', 2);

    -- Bootstrap default modes (standard Assistant + Image Creator + GDM AI) if app_modes is empty
    INSERT INTO app_modes (
      name, label, assistant_id, img, welcome_message, info_text, obs_items,
      visible, image_upload, file_upload, gpts, transcription, sort_order
    )
    SELECT
      'AZURE_FOUNDRY__0', 'Assistent', 'General', '/modules/chat_blue.png',
      'Vad vill du chatta om idag?',
      'Standardassistent för generella frågor, textbearbetning och analys.',
      '[\"All data behandlas och lagras i svenska datacenter och skyddas med samma säkerhetskrav som Microsoft 365.\"]',
      1, 1, 1, 1, 1, 1
    FROM DUAL
    WHERE NOT EXISTS (SELECT 1 FROM app_modes WHERE name = 'AZURE_FOUNDRY__0' LIMIT 1);

    INSERT INTO app_modes (
      name, label, img, image_model, welcome_message, info_text, obs_items,
      visible, image_upload, file_upload, gpts, transcription, sort_order
    )
    SELECT
      'FOUNDRY_IMAGE_GENERATION', 'Bildskapare', '/modules/img_red.png', 'agent-gdm-openai-gpt-image-1.5',
      'Vad vill du att jag skapar för bild?',
      'Skapa och redigera bilder baserat på dina textbeskrivningar.',
      '[\"Granska den genererade bilden noggrant innan den används externt.\"]',
      1, 1, 0, 0, 0, 2
    FROM DUAL
    WHERE NOT EXISTS (SELECT 1 FROM app_modes WHERE name = 'FOUNDRY_IMAGE_GENERATION' LIMIT 1);

    {{- if .Values.ai.gdmModels.enabled }}
    INSERT INTO app_modes (
      name, label, img, model, endpoint, api_key, welcome_message, info_text, obs_items,
      visible, image_upload, file_upload, gpts, transcription, sort_order
    )
    SELECT
      'GDM_AI_CHAT_COMPLETION__0', 'Lokal Assistent (GDM AI)', '/modules/chat_green.png', 'gpt-oss-120b',
      'https://ai.gdm.se/api/v1', '{{ .Values.ai.gdmModels.apiKey | default .Values.ai.gdmAiApiKey }}',
      'Vad vill du chatta om idag?',
      'Lokal assistent som körs direkt i GDM:s kluster.',
      '[\"Data behandlas lokalt i Sverige.\"]',
      1, 1, 1, 0, 0, 3
    FROM DUAL
    WHERE NOT EXISTS (SELECT 1 FROM app_modes WHERE name = 'GDM_AI_CHAT_COMPLETION__0' LIMIT 1);
    {{- end }}

    -- Bootstrap translations override
    {{- if .Files.Get "files/translations.sql" }}
    {{ .Files.Get "files/translations.sql" | nindent 4 }}
    {{- end }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: SqlJob
metadata:
  name: {{ include "hej.fullname" . }}-mariadb-init-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb-init
spec:
  mariaDbRef:
    name: {{ include "hej.fullname" . }}-mariadb
    waitForIt: true
  username: {{ .Values.mariadb.auth.username | quote }}
  passwordSecretKeyRef:
    name: {{ include "hej.fullname" . }}-secrets
    key: MARIADB_PASSWORD
  database: {{ .Values.mariadb.auth.database | quote }}
  backoffLimit: 10
  restartPolicy: OnFailure
  sqlConfigMapKeyRef:
    name: {{ include "hej.fullname" . }}-mariadb-init-sql-{{ .Release.Revision }}
    key: init.sql
{{- end }}
{{- end }}
