apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_PASSWORD: {{ default (randAlphaNum 24) .Values.mariadb.auth.password | quote }}
  MARIADB_ROOT_PASSWORD: {{ default (randAlphaNum 24) .Values.mariadb.auth.rootPassword | quote }}
  CRYPTR_SECRET: {{ default (randAlphaNum 32) .Values.secrets.cryptrSecret | quote }}
  EXPRESS_SESSION_SECRET: {{ default (randAlphaNum 32) .Values.secrets.expressSessionSecret | quote }}
  CONSOLE_PASSWORD: {{ default (randAlphaNum 16) .Values.secrets.consolePassword | quote }}
  SUPER_PASSWORD: {{ default (randAlphaNum 16) .Values.secrets.superPassword | quote }}
  HEJ_OVERVIEW_PASSWORD: {{ default (randAlphaNum 20) .Values.secrets.hejOverviewPassword | quote }}
  GDM_AI_API_KEY: {{ .Values.ai.gdmAiApiKey | quote }}
  FOUNDRY_API_KEY: {{ .Values.ai.foundryKey | quote }}
---
{{- if or .Values.branding.logoBase64 .Values.branding.backgroundBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-branding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.branding.logoBase64 }}
  logo.png: {{ .Values.branding.logoBase64 | quote }}
  {{- end }}
  {{- if .Values.branding.backgroundBase64 }}
  background.webp: {{ .Values.branding.backgroundBase64 | quote }}
  {{- end }}
{{- end }}
