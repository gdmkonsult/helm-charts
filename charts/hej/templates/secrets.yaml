{{- include "hej.validateValues" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "hej.fullname" .)) -}}
{{- $existingOverview := lookup "v1" "Secret" .Release.Namespace (printf "%s-overview" (include "hej.fullname" .)) -}}
{{- $sourceSecret := dict -}}
{{- if .Values.copyFrom.enabled -}}
{{- $sourceSecret = lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "hej.sourceFullname" .)) -}}
{{- end -}}
{{- $overviewPassword := .Values.secrets.hejOverviewPassword -}}
{{- if not $overviewPassword -}}
  {{- if and $existingOverview (hasKey $existingOverview.data "HEJ_OVERVIEW_PASSWORD") -}}
    {{- $overviewPassword = index $existingOverview.data "HEJ_OVERVIEW_PASSWORD" | b64dec -}}
  {{- else if and $existingSecret (hasKey $existingSecret.data "HEJ_OVERVIEW_PASSWORD") -}}
    {{- $overviewPassword = index $existingSecret.data "HEJ_OVERVIEW_PASSWORD" | b64dec -}}
  {{- else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "HEJ_OVERVIEW_PASSWORD") -}}
    {{- $overviewPassword = index $sourceSecret.data "HEJ_OVERVIEW_PASSWORD" | b64dec -}}
  {{- else -}}
    {{- $overviewPassword = randAlphaNum 20 -}}
  {{- end -}}
{{- end -}}
{{- $toolRuntimeToken := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "TOOL_RUNTIME_TOKEN") -}}
  {{- $toolRuntimeToken = index $existingSecret.data "TOOL_RUNTIME_TOKEN" | b64dec -}}
{{- else -}}
  {{- $toolRuntimeToken = randAlphaNum 48 -}}
{{- end -}}
{{- $runtimeFileSigningKey := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "RUNTIME_FILE_SIGNING_KEY") -}}
  {{- $runtimeFileSigningKey = index $existingSecret.data "RUNTIME_FILE_SIGNING_KEY" | b64dec -}}
{{- else -}}
  {{- $runtimeFileSigningKey = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_PASSWORD: {{ if .Values.mariadb.auth.password }}{{ .Values.mariadb.auth.password | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "MARIADB_PASSWORD") }}{{ index $existingSecret.data "MARIADB_PASSWORD" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "MARIADB_PASSWORD") }}{{ index $sourceSecret.data "MARIADB_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  MARIADB_ROOT_PASSWORD: {{ if .Values.mariadb.auth.rootPassword }}{{ .Values.mariadb.auth.rootPassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "MARIADB_ROOT_PASSWORD") }}{{ index $existingSecret.data "MARIADB_ROOT_PASSWORD" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "MARIADB_ROOT_PASSWORD") }}{{ index $sourceSecret.data "MARIADB_ROOT_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  CRYPTR_SECRET: {{ if .Values.secrets.cryptrSecret }}{{ .Values.secrets.cryptrSecret | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "CRYPTR_SECRET") }}{{ index $existingSecret.data "CRYPTR_SECRET" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "CRYPTR_SECRET") }}{{ index $sourceSecret.data "CRYPTR_SECRET" | b64dec | quote }}{{ else if .Values.copyFrom.enabled }}{{ fail (printf "copyFrom.enabled is true but could not find CRYPTR_SECRET in source secret %s-secrets" (include "hej.sourceFullname" .)) }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  EXPRESS_SESSION_SECRET: {{ if .Values.secrets.expressSessionSecret }}{{ .Values.secrets.expressSessionSecret | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "EXPRESS_SESSION_SECRET") }}{{ index $existingSecret.data "EXPRESS_SESSION_SECRET" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "EXPRESS_SESSION_SECRET") }}{{ index $sourceSecret.data "EXPRESS_SESSION_SECRET" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  CONSOLE_PASSWORD: {{ if .Values.secrets.consolePassword }}{{ .Values.secrets.consolePassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "CONSOLE_PASSWORD") }}{{ index $existingSecret.data "CONSOLE_PASSWORD" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "CONSOLE_PASSWORD") }}{{ index $sourceSecret.data "CONSOLE_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 16 | quote }}{{ end }}
  SUPER_PASSWORD: {{ if .Values.secrets.superPassword }}{{ .Values.secrets.superPassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "SUPER_PASSWORD") }}{{ index $existingSecret.data "SUPER_PASSWORD" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "SUPER_PASSWORD") }}{{ index $sourceSecret.data "SUPER_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 16 | quote }}{{ end }}
  HEJ_OVERVIEW_PASSWORD: {{ $overviewPassword | quote }}
  GDM_AI_API_KEY: {{ if .Values.ai.gdmAiApiKey }}{{ .Values.ai.gdmAiApiKey | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "GDM_AI_API_KEY") }}{{ index $existingSecret.data "GDM_AI_API_KEY" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "GDM_AI_API_KEY") }}{{ index $sourceSecret.data "GDM_AI_API_KEY" | b64dec | quote }}{{ else }}""{{ end }}
  FOUNDRY_API_KEY: {{ if .Values.ai.foundryKey }}{{ .Values.ai.foundryKey | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "FOUNDRY_API_KEY") }}{{ index $existingSecret.data "FOUNDRY_API_KEY" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "FOUNDRY_API_KEY") }}{{ index $sourceSecret.data "FOUNDRY_API_KEY" | b64dec | quote }}{{ else }}""{{ end }}
  GDM_N8N_PASS: {{ if .Values.ai.gdmN8nPass }}{{ .Values.ai.gdmN8nPass | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "GDM_N8N_PASS") }}{{ index $existingSecret.data "GDM_N8N_PASS" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "GDM_N8N_PASS") }}{{ index $sourceSecret.data "GDM_N8N_PASS" | b64dec | quote }}{{ else }}""{{ end }}
  # Shared bearer token backend -> tool runtime, and the HMAC key for the
  # short-lived file tokens the runtime uses to fetch files from the backend.
  TOOL_RUNTIME_TOKEN: {{ $toolRuntimeToken | quote }}
  RUNTIME_FILE_SIGNING_KEY: {{ $runtimeFileSigningKey | quote }}
  {{- with .Values.extraSecrets }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
stringData:
  HEJ_OVERVIEW_PASSWORD: {{ $overviewPassword | quote }}
  FOUNDRY_API_KEY: {{ if .Values.ai.foundryKey }}{{ .Values.ai.foundryKey | quote }}{{ else if and $existingOverview (hasKey $existingOverview.data "FOUNDRY_API_KEY") }}{{ index $existingOverview.data "FOUNDRY_API_KEY" | b64dec | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "FOUNDRY_API_KEY") }}{{ index $existingSecret.data "FOUNDRY_API_KEY" | b64dec | quote }}{{ else if and .Values.copyFrom.enabled $sourceSecret (hasKey $sourceSecret.data "FOUNDRY_API_KEY") }}{{ index $sourceSecret.data "FOUNDRY_API_KEY" | b64dec | quote }}{{ else }}""{{ end }}
  FOUNDRY_RESOURCE_ENDPOINT: {{ .Values.ai.foundryEndpoint | quote }}
  FOUNDRY_PROJECT_NAME: {{ .Values.ai.foundryProjectName | quote }}
---
{{- if .Values.toolRuntime.enabled }}
# Only the runtime's bearer token, mounted as a file in the runtime pod, so the
# runtime never sees the signing key or any other release secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.toolRuntimeHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-runtime
type: Opaque
stringData:
  token: {{ $toolRuntimeToken | quote }}
{{- end }}
---
{{- if or .Values.branding.logoBase64 .Values.branding.backgroundBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-branding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.branding.logoBase64 }}
  logo.png: {{ .Values.branding.logoBase64 | quote }}
  {{- end }}
  {{- if .Values.branding.backgroundBase64 }}
  background.webp: {{ .Values.branding.backgroundBase64 | quote }}
  {{- end }}
{{- end }}
