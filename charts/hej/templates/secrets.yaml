{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "hej.fullname" .)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_PASSWORD: {{ if .Values.mariadb.auth.password }}{{ .Values.mariadb.auth.password | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "MARIADB_PASSWORD") }}{{ index $existingSecret.data "MARIADB_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  MARIADB_ROOT_PASSWORD: {{ if .Values.mariadb.auth.rootPassword }}{{ .Values.mariadb.auth.rootPassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "MARIADB_ROOT_PASSWORD") }}{{ index $existingSecret.data "MARIADB_ROOT_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  CRYPTR_SECRET: {{ if .Values.secrets.cryptrSecret }}{{ .Values.secrets.cryptrSecret | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "CRYPTR_SECRET") }}{{ index $existingSecret.data "CRYPTR_SECRET" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  EXPRESS_SESSION_SECRET: {{ if .Values.secrets.expressSessionSecret }}{{ .Values.secrets.expressSessionSecret | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "EXPRESS_SESSION_SECRET") }}{{ index $existingSecret.data "EXPRESS_SESSION_SECRET" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  CONSOLE_PASSWORD: {{ if .Values.secrets.consolePassword }}{{ .Values.secrets.consolePassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "CONSOLE_PASSWORD") }}{{ index $existingSecret.data "CONSOLE_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 16 | quote }}{{ end }}
  SUPER_PASSWORD: {{ if .Values.secrets.superPassword }}{{ .Values.secrets.superPassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "SUPER_PASSWORD") }}{{ index $existingSecret.data "SUPER_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 16 | quote }}{{ end }}
  HEJ_OVERVIEW_PASSWORD: {{ if .Values.secrets.hejOverviewPassword }}{{ .Values.secrets.hejOverviewPassword | quote }}{{ else if and $existingSecret (hasKey $existingSecret.data "HEJ_OVERVIEW_PASSWORD") }}{{ index $existingSecret.data "HEJ_OVERVIEW_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 20 | quote }}{{ end }}
  GDM_AI_API_KEY: {{ .Values.ai.gdmAiApiKey | quote }}
  FOUNDRY_API_KEY: {{ .Values.ai.foundryKey | quote }}
---
{{- if or .Values.branding.logoBase64 .Values.branding.backgroundBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hej.fullname" . }}-branding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hej.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.branding.logoBase64 }}
  logo.png: {{ .Values.branding.logoBase64 | quote }}
  {{- end }}
  {{- if .Values.branding.backgroundBase64 }}
  background.webp: {{ .Values.branding.backgroundBase64 | quote }}
  {{- end }}
{{- end }}
