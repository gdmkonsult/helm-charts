{{- $secretName := printf "%s-secrets" (include "rustfs.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := .Values.auth.accessKey -}}
{{- if not $accessKey -}}
  {{- if and $existing (hasKey $existing.data "accesskey") -}}
    {{- $accessKey = index $existing.data "accesskey" | b64dec -}}
  {{- else -}}
    {{- $accessKey = randAlphaNum 20 -}}
  {{- end -}}
{{- end -}}
{{- $secretKey := .Values.auth.secretKey -}}
{{- if not $secretKey -}}
  {{- if and $existing (hasKey $existing.data "secretkey") -}}
    {{- $secretKey = index $existing.data "secretkey" | b64dec -}}
  {{- else -}}
    {{- $secretKey = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
# Root credentials. Key names are fixed by the operator's credsSecret contract.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  accesskey: {{ $accessKey | quote }}
  secretkey: {{ $secretKey | quote }}
