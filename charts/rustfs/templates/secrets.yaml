{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "rustfs.fullname" .)) -}}
{{- $accessKey := .Values.auth.accessKey -}}
{{- if not $accessKey -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "RUSTFS_ACCESS_KEY") -}}
    {{- $accessKey = index $existingSecret.data "RUSTFS_ACCESS_KEY" | b64dec -}}
  {{- else -}}
    {{- $accessKey = randAlphaNum 20 -}}
  {{- end -}}
{{- end -}}
{{- $secretKey := .Values.auth.secretKey -}}
{{- if not $secretKey -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "RUSTFS_SECRET_KEY") -}}
    {{- $secretKey = index $existingSecret.data "RUSTFS_SECRET_KEY" | b64dec -}}
  {{- else -}}
    {{- $secretKey = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: {{ $accessKey | quote }}
  RUSTFS_SECRET_KEY: {{ $secretKey | quote }}
