apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: s3
      port: {{ .Values.service.s3Port }}
      targetPort: s3
    {{- if .Values.console.enabled }}
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
    {{- end }}
  selector:
    {{- include "rustfs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
