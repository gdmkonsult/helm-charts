{{- if and .Values.authProxy.enabled (eq .Values.authProxy.type "oauth2-proxy") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}-auth-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-proxy
  template:
    metadata:
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --http-address=0.0.0.0:4180
            - --upstream={{ printf "http://%s-main:%d" (include "n8n.fullname" .) (int .Values.main.service.port) }}
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.authProxy.oidc.issuerUrl }}
            - --client-id={{ .Values.authProxy.oidc.clientId }}
            - --client-secret={{ .Values.authProxy.oidc.clientSecret }}
            - --cookie-secret={{ .Values.authProxy.cookieSecret | default (randAlphaNum 32) }}
            - --cookie-secure=true
            - --cookie-domain={{ .Values.global.domain }}
            - --email-domain={{ .Values.authProxy.allowedEmailDomain | default "*" }}
            - --scope=openid email profile
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            {{- if .Values.authProxy.skipAuthRegex }}
            - --skip-auth-regex={{ .Values.authProxy.skipAuthRegex }}
            {{- end }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n.fullname" . }}-auth-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
spec:
  type: ClusterIP
  ports:
    - port: 4180
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "n8n.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
{{- end }}
