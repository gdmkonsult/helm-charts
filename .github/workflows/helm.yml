name: Helm Publish

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_dispatch:
  
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - name: Hooks must be Jobs/Pods and never depend on plain resources
        run: ./scripts/check-hook-deps.sh
      - name: Upgrade must not delete stateful resources; CNPG Clusters must be keep
        run: ./scripts/check-upgrade-safety.sh

  release:
    needs: safety
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"