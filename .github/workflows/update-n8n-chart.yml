name: Update n8n Chart

on:
  schedule:
    # Poll every 15 minutes
    - cron: "0/15 * * * *"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Override version (e.g. 1.68.0). Leave empty to auto-detect latest."
        required: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new n8n release
        id: version
        run: |
          # Read current appVersion from Chart.yaml first - needed for the downgrade guard below.
          CURRENT_APP=$(grep '^appVersion:' charts/n8n/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')

          # n8n-io/n8n runs TWO release trains concurrently under the same "n8n@X.Y.Z" tag
          # pattern: the legacy 1.123.x line (still gets non-prerelease security backports)
          # and the current 2.x line (mostly tagged prerelease:true while it stabilizes).
          # The API returns releases sorted by creation time, NOT by version, so naively taking
          # the first non-draft/non-prerelease match can pick a just-published 1.123.x backport
          # over the numerically newer 2.x release we're already on - a silent downgrade.
          # Fix: collect ALL matching stable tags and pick the highest by semver (`sort -V`),
          # not the most recently created one. per_page=100 to look back far enough past any
          # interleaved backports on the other track.
          APP_VERSION=$(curl -sf "https://api.github.com/repos/n8n-io/n8n/releases?per_page=100" \
            | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | select(.tag_name | test("^n8n@[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name' \
            | sed 's/^n8n@//' \
            | sort -V | tail -1)

          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not fetch latest release from n8n-io/n8n"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Allow manual override - an explicit human choice, so it bypasses the downgrade guard too.
          if [[ -n "${{ github.event.inputs.app_version }}" ]]; then
            APP_VERSION="${{ github.event.inputs.app_version }}"
          else
            # Never let the scheduled poll move appVersion backwards (e.g. onto the older
            # 1.123.x track). Only proceed if the candidate is strictly newer by semver.
            HIGHEST=$(printf '%s\n%s\n' "$CURRENT_APP" "$APP_VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$APP_VERSION" || "$APP_VERSION" == "$CURRENT_APP" ]]; then
              echo "Candidate ${APP_VERSION} is not newer than current ${CURRENT_APP} - skipping (refusing downgrade)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Latest n8n release: ${APP_VERSION}"
          echo "Current chart appVersion: ${CURRENT_APP}"

          if [[ "$APP_VERSION" == "$CURRENT_APP" ]]; then
            echo "Already up to date."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # Bump chart patch version
          CURRENT=$(grep '^version:' charts/n8n/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          CHART_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Chart version: ${CURRENT} -> ${CHART_VERSION}"

      - name: Update Chart.yaml and values.yaml
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart_version }}/" charts/n8n/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" charts/n8n/Chart.yaml
          cat charts/n8n/Chart.yaml

          # Update the shared n8n image tag in values.yaml (main/runner/worker fall back to this
          # via n8n.mainImage/n8n.runnerImage/n8n.workerImage in _helpers.tpl - only one line to touch).
          sed -i '/repository: n8nio\/n8n$/{n;s/tag: ".*"/tag: "'"${{ steps.version.outputs.app_version }}"'"/;}' charts/n8n/values.yaml
          echo "Updated values.yaml image tag:"
          grep -A1 'repository: n8nio/n8n$' charts/n8n/values.yaml

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/n8n/Chart.yaml charts/n8n/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(n8n): bump appVersion to ${{ steps.version.outputs.app_version }} and chart version to ${{ steps.version.outputs.chart_version }}"
          git push

      - name: Trigger Helm Publish
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'helm.yml',
              ref: 'main',
            });
