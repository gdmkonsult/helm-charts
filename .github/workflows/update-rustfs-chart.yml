name: Update rustfs Chart

on:
  schedule:
    # Poll once a week (Monday 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Override version (e.g. 1.0.5). Leave empty to auto-detect latest."
        required: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new rustfs release
        id: version
        run: |
          CURRENT_APP=$(grep '^appVersion:' charts/rustfs/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')

          # rustfs/rustfs tags stable releases as plain semver (1.0.4); prereleases
          # carry a suffix (-rc.N, -preview.N). Pick the highest stable tag by
          # semver, not the most recent, so a backport can never cause a downgrade.
          APP_VERSION=$(curl -sf "https://api.github.com/repos/rustfs/rustfs/releases?per_page=100" \
            | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | select(.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name' \
            | sort -V | tail -1)

          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not fetch latest release from rustfs/rustfs"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Allow manual override - an explicit human choice, so it bypasses the downgrade guard too.
          if [[ -n "${{ github.event.inputs.app_version }}" ]]; then
            APP_VERSION="${{ github.event.inputs.app_version }}"
          else
            # Never let the scheduled poll move appVersion backwards.
            HIGHEST=$(printf '%s\n%s\n' "$CURRENT_APP" "$APP_VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$APP_VERSION" || "$APP_VERSION" == "$CURRENT_APP" ]]; then
              echo "Candidate ${APP_VERSION} is not newer than current ${CURRENT_APP} - skipping (refusing downgrade)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Latest rustfs release: ${APP_VERSION}"
          echo "Current chart appVersion: ${CURRENT_APP}"

          if [[ "$APP_VERSION" == "$CURRENT_APP" ]]; then
            echo "Already up to date."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # Bump chart minor version (new upstream image = more than a patch)
          CURRENT=$(grep '^version:' charts/rustfs/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          CHART_VERSION="${MAJOR}.${NEW_MINOR}.0"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Chart version: ${CURRENT} -> ${CHART_VERSION}"

      - name: Update Chart.yaml
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart_version }}/" charts/rustfs/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" charts/rustfs/Chart.yaml
          cat charts/rustfs/Chart.yaml

          # The image tag is empty in values.yaml and falls back to appVersion
          # (templates/tenant.yaml), so only Chart.yaml needs touching.

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/rustfs/Chart.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(rustfs): bump appVersion to ${{ steps.version.outputs.app_version }} and chart version to ${{ steps.version.outputs.chart_version }}"
          git push

      - name: Trigger Helm Publish
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'helm.yml',
              ref: 'main',
            });
