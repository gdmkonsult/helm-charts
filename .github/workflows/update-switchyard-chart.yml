name: Update Switchyard Chart

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Override version (e.g. 0.3.1). Leave empty to auto-detect latest."
        required: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new versions
        id: version
        run: |
          CURRENT_APP=$(grep '^appVersion:' charts/switchyard/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')

          # --- Switchyard app version: check both releases and tags from upstream NVIDIA-NeMo/Switchyard ---
          LATEST_TAG=$(curl -sf "https://api.github.com/repos/NVIDIA-NeMo/Switchyard/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          LATEST_RELEASE=$(curl -sf "https://api.github.com/repos/NVIDIA-NeMo/Switchyard/releases?per_page=100" \
            | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          CANDIDATE=$(printf "%s\n%s\n" "$LATEST_TAG" "$LATEST_RELEASE" | grep -v '^$' | sort -V | tail -1)

          APP_CHANGED=false
          APP_VERSION="$CURRENT_APP"

          if [[ -z "$CANDIDATE" ]]; then
            echo "Could not fetch tags/releases from NVIDIA-NeMo/Switchyard"
          else
            CANDIDATE="${CANDIDATE#v}"

            # Allow manual override if specified via workflow_dispatch (bypasses newer-check)
            if [[ -n "${{ github.event.inputs.app_version }}" ]]; then
              APP_VERSION="${{ github.event.inputs.app_version }}"
              APP_VERSION="${APP_VERSION#v}"
              APP_CHANGED=true
            elif [[ "$CANDIDATE" != "$CURRENT_APP" ]]; then
              # Ensure candidate is strictly newer than current appVersion
              HIGHEST=$(printf "%s\n%s\n" "$CURRENT_APP" "$CANDIDATE" | sort -V | tail -1)
              if [[ "$HIGHEST" == "$CANDIDATE" ]]; then
                APP_VERSION="$CANDIDATE"
                APP_CHANGED=true
              fi
            fi
          fi

          # --- nginx auth-proxy image: latest X.Y.Z-alpine from Docker Hub ---
          CURRENT_NGINX=$(awk '/repository: nginx/{getline; gsub(/tag: *"|"/, ""); print}' charts/switchyard/values.yaml)

          LATEST_NGINX=""
          for PAGE in 1 2 3; do
            TAGS=$(curl -sf "https://hub.docker.com/v2/repositories/library/nginx/tags/?page_size=100&page=${PAGE}&name=alpine" \
              | jq -r '.results[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpine$' || true)
            if [[ -n "$TAGS" ]]; then
              LATEST_NGINX=$(printf "%s\n%s\n" "$LATEST_NGINX" "$TAGS" | grep -v '^$' | sort -V | tail -1)
            fi
          done

          NGINX_CHANGED=false
          NGINX_VERSION="$CURRENT_NGINX"
          if [[ -z "$LATEST_NGINX" ]]; then
            echo "Could not fetch nginx tags from Docker Hub"
          elif [[ "$LATEST_NGINX" != "$CURRENT_NGINX" ]]; then
            # Only move forward, never downgrade
            HIGHEST=$(printf "%s\n%s\n" "$CURRENT_NGINX" "$LATEST_NGINX" | sort -V | tail -1)
            if [[ "$HIGHEST" == "$LATEST_NGINX" ]]; then
              NGINX_VERSION="$LATEST_NGINX"
              NGINX_CHANGED=true
            else
              echo "nginx candidate ${LATEST_NGINX} is older than current ${CURRENT_NGINX} - ignoring"
            fi
          fi

          if [[ "$APP_CHANGED" != "true" && "$NGINX_CHANGED" != "true" ]]; then
            echo "Nothing to update (app=${CURRENT_APP}, nginx=${CURRENT_NGINX})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bump chart patch version
          CURRENT=$(grep '^version:' charts/switchyard/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          CHART_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          SUMMARY=""
          if [[ "$APP_CHANGED" == "true" ]]; then
            SUMMARY="appVersion ${CURRENT_APP} -> ${APP_VERSION}"
          fi
          if [[ "$NGINX_CHANGED" == "true" ]]; then
            [[ -n "$SUMMARY" ]] && SUMMARY="${SUMMARY}, "
            SUMMARY="${SUMMARY}nginx ${CURRENT_NGINX} -> ${NGINX_VERSION}"
          fi

          echo "Updating: ${SUMMARY} (chart ${CURRENT} -> ${CHART_VERSION})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "app_changed=${APP_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "nginx_changed=${NGINX_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "nginx_version=${NGINX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Trigger container image build in Switchyard repo
        if: steps.version.outputs.app_changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'Switchyard',
              workflow_id: 'docker-publish.yml',
              ref: 'main',
              inputs: {
                image_tag: `v${{ steps.version.outputs.app_version }}`
              }
            });
            console.log('Triggered Switchyard container build for tag v${{ steps.version.outputs.app_version }}');

      - name: Wait for image build to finish
        if: steps.version.outputs.app_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          START=$(date -u +%s)
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list -R "$OWNER/Switchyard" --workflow docker-publish.yml --limit 1 --json databaseId,createdAt \
              --jq ".[0] | select((.createdAt | fromdateiso8601) >= $START - 120) | .databaseId" 2>/dev/null || true)
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Could not find Switchyard build run" >&2
            exit 1
          fi
          echo "Watching build run $RUN_ID"
          gh run watch "$RUN_ID" -R "$OWNER/Switchyard" --exit-status

      - name: Update Chart.yaml and values.yaml
        if: steps.version.outputs.skip != 'true'
        run: |
          if [[ "${{ steps.version.outputs.app_changed }}" == "true" ]]; then
            sed -i "s/^appVersion: .*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" charts/switchyard/Chart.yaml
            sed -i 's/tag: "v.*"/tag: "v'"${{ steps.version.outputs.app_version }}"'"/' charts/switchyard/values.yaml
          fi
          if [[ "${{ steps.version.outputs.nginx_changed }}" == "true" ]]; then
            NGINX_VERSION="${{ steps.version.outputs.nginx_version }}"
            awk -v v="$NGINX_VERSION" '/repository: nginx/{print; getline; gsub(/tag: *"[^"]*"/, "tag: \"" v "\"")} {print}' charts/switchyard/values.yaml > values.yaml.tmp
            mv values.yaml.tmp charts/switchyard/values.yaml
          fi
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart_version }}/" charts/switchyard/Chart.yaml

          echo "Updated Chart.yaml:"
          cat charts/switchyard/Chart.yaml
          echo "Updated values.yaml image tags:"
          grep -B1 -A1 'tag:' charts/switchyard/values.yaml

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/switchyard/Chart.yaml charts/switchyard/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(switchyard): update ${{ steps.version.outputs.summary }} (chart ${{ steps.version.outputs.chart_version }})"
          git push

      - name: Trigger Helm Publish
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'helm.yml',
              ref: 'main',
            });
