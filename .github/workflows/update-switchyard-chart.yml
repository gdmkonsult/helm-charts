name: Update Switchyard Chart

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Override version (e.g. 0.3.1). Leave empty to auto-detect latest."
        required: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new Switchyard release
        id: version
        run: |
          # Read current appVersion from Chart.yaml
          CURRENT_APP=$(grep '^appVersion:' charts/switchyard/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')

          # Check both releases and tags from upstream NVIDIA-NeMo/Switchyard
          # Collect all tags like vX.Y.Z (excluding release candidates like -rc)
          LATEST_TAG=$(curl -sf "https://api.github.com/repos/NVIDIA-NeMo/Switchyard/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          # Also check official GitHub releases if available
          LATEST_RELEASE=$(curl -sf "https://api.github.com/repos/NVIDIA-NeMo/Switchyard/releases?per_page=100" \
            | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          CANDIDATE=$(printf "%s\n%s\n" "$LATEST_TAG" "$LATEST_RELEASE" | grep -v '^$' | sort -V | tail -1)

          if [[ -z "$CANDIDATE" ]]; then
            echo "Could not fetch tags/releases from NVIDIA-NeMo/Switchyard"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_VERSION="${CANDIDATE#v}"

          # Allow manual override if specified via workflow_dispatch
          if [[ -n "${{ github.event.inputs.app_version }}" ]]; then
            APP_VERSION="${{ github.event.inputs.app_version }}"
            APP_VERSION="${APP_VERSION#v}"
          else
            # Ensure candidate is strictly newer than current appVersion
            HIGHEST=$(printf "%s\n%s\n" "$CURRENT_APP" "$APP_VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$APP_VERSION" || "$APP_VERSION" == "$CURRENT_APP" ]]; then
              echo "Candidate ${APP_VERSION} is not newer than current ${CURRENT_APP} - skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Latest Switchyard release: ${APP_VERSION}"
          echo "Current chart appVersion: ${CURRENT_APP}"

          if [[ "$APP_VERSION" == "$CURRENT_APP" ]]; then
            echo "Already up to date."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # Bump chart patch version
          CURRENT=$(grep '^version:' charts/switchyard/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          CHART_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Chart version: ${CURRENT} -> ${CHART_VERSION}"

      - name: Trigger container image build in Switchyard repo
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: 'Switchyard',
                workflow_id: 'docker-publish.yml',
                ref: 'main',
                inputs: {
                  image_tag: `v${{ steps.version.outputs.app_version }}`
                }
              });
              console.log('Triggered Switchyard container build for tag v${{ steps.version.outputs.app_version }}');
            } catch (err) {
              console.error('Failed to trigger Switchyard build:', err);
              // Non-blocking in case workflow dispatch permissions differ
            }

      - name: Update Chart.yaml and values.yaml
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart_version }}/" charts/switchyard/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" charts/switchyard/Chart.yaml
          sed -i 's/tag: "v.*"/tag: "v'"${{ steps.version.outputs.app_version }}"'"/' charts/switchyard/values.yaml

          echo "Updated Chart.yaml:"
          cat charts/switchyard/Chart.yaml
          echo "Updated values.yaml image tag:"
          grep -A1 'repository: ghcr.io/gdmkonsult/switchyard' charts/switchyard/values.yaml

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/switchyard/Chart.yaml charts/switchyard/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(switchyard): bump appVersion to ${{ steps.version.outputs.app_version }} and chart version to ${{ steps.version.outputs.chart_version }}"
          git push

      - name: Trigger Helm Publish
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'helm.yml',
              ref: 'main',
            });
