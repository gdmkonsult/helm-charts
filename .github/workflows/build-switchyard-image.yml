name: Build Switchyard Container Image

on:
  workflow_dispatch:
    inputs:
      switchyard_ref:
        description: "Git ref/branch/tag from NVIDIA-NeMo/Switchyard to build"
        required: true
        default: "main"
      image_tag:
        description: "Docker image tag to publish to ghcr.io"
        required: true
        default: "v0.3.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Switchyard
        uses: actions/checkout@v4
        with:
          repository: "NVIDIA-NeMo/Switchyard"
          ref: ${{ github.event.inputs.switchyard_ref || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/switchyard-server:${{ github.event.inputs.image_tag || 'v0.3.0' }}
            ghcr.io/${{ github.repository_owner }}/switchyard-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
